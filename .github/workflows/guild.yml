name: Guild

on:
  issues:
    types: [opened, labeled, unlabeled]
  push:
    branches: [main]
    paths: ["data/**"]
  schedule:
    # Merged pull requests in other repositories cannot trigger this workflow,
    # so the leaderboard is also refreshed every hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  process:
    # Check a new Join / Flag / Team repository issue.
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Process issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEST_ANSWERS: ${{ secrets.QUEST_ANSWERS }}
          GUILD_ROSTER: ${{ secrets.GUILD_ROSTER }}
        run: python3 .github/scripts/guild.py process

  leaderboard:
    # Rebuild LEADERBOARD.md from issues and data/*.csv.
    needs: process
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: leaderboard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Build leaderboard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEST_ANSWERS: ${{ secrets.QUEST_ANSWERS }}
          GUILD_ROSTER: ${{ secrets.GUILD_ROSTER }}
          QUESTS_REPO: ${{ vars.QUESTS_REPO }}
        run: python3 .github/scripts/guild.py leaderboard
      - name: Commit leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEADERBOARD.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -q -m "docs: update leaderboard"
          for i in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          exit 1
